spring.application.name=FileDrive

# Carpeta raíz del drive (relativa a donde se arranca la aplicación)
filedrive.raiz=drive

# Permite usar <input type="hidden" name="_method" value="delete"> para el @DeleteMapping
spring.mvc.hiddenmethod.filter.enabled=true

# Tamaño máximo de los ficheros subidos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.tracking-modes=cookie
